name: Build-Windows-Runtime-Fix

on:
  push:
    branches:
      - fix/runtime-entities
      - fix/playback-bypass

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.12

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy Env
        shell: pwsh
        run: Copy-Item .env.example .env

      - name: Build Windows installer
        env:
          ELECTRON_WEB_SERVER_PORT: 42710
          ELECTRON_DEV_NETEASE_API_PORT: 30001
          UNBLOCK_SERVER_PORT: 30003
          VITE_APP_NETEASE_API_URL: /netease
          ENABLE_FLAC: "true"
          ENABLE_LOCAL_VIP: "svip"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm package

      - name: Verify entities runtime dependency in app.asar
        shell: pwsh
        run: |
          $asar = Get-ChildItem -Path ./packages/desktop/release -Filter app.asar -Recurse | Select-Object -First 1
          if (-not $asar) {
            throw "app.asar was not found in packaged Windows output"
          }
          $entries = pnpm dlx @electron/asar list $asar.FullName
          if (-not ($entries | Select-String -Pattern 'node_modules[\\/]entities[\\/]package\.json')) {
            throw "entities runtime dependency is missing from app.asar"
          }
          if (-not ($entries | Select-String -Pattern 'node_modules[\\/]entities[\\/]dist[\\/]commonjs[\\/]decode\.js')) {
            throw "entities/decode implementation is missing from app.asar"
          }
          Write-Host "Verified entities/decode in packaged app.asar"

      - name: Smoke-test packaged NetEase API with Electron Node
        shell: pwsh
        run: |
          $app = Resolve-Path "./packages/desktop/release/win-unpacked/R3PLAYX.exe"
          $resources = Resolve-Path "./packages/desktop/release/win-unpacked/resources"
          Push-Location $resources
          try {
            $env:ELECTRON_RUN_AS_NODE = "1"
            $output = (& $app -e "require('./app.asar/node_modules/@neteasecloudmusicapienhanced/api'); console.log('NETEASE_API_REQUIRE_OK')" 2>&1 | Out-String)
            Write-Host $output
            if ($output -notmatch "NETEASE_API_REQUIRE_OK") {
              throw "Packaged NetEase API failed to load under Electron Node"
            }
          } finally {
            Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
            Pop-Location
          }

      - name: Smoke-test packaged UnblockNeteaseMusic module
        shell: pwsh
        run: |
          $app = Resolve-Path "./packages/desktop/release/win-unpacked/R3PLAYX.exe"
          $resources = Resolve-Path "./packages/desktop/release/win-unpacked/resources"
          Push-Location $resources
          try {
            $env:ELECTRON_RUN_AS_NODE = "1"
            $output = (& $app -e "const match=require('./app.asar/node_modules/@unblockneteasemusic/server'); console.log('UNBLOCK_MATCH_TYPE='+typeof match)" 2>&1 | Out-String)
            Write-Host $output
            if ($output -notmatch "UNBLOCK_MATCH_TYPE=function") {
              throw "Packaged UnblockNeteaseMusic module is unavailable"
            }
          } finally {
            Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
            Pop-Location
          }

      - name: Smoke-test packaged Windows playback route
        shell: pwsh
        run: |
          $app = Resolve-Path "./packages/desktop/release/win-unpacked/R3PLAYX.exe"
          $process = Start-Process -FilePath $app -ArgumentList "--disable-gpu" -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) {
                throw "R3PLAYX exited during startup smoke test (exit code $($process.ExitCode))"
              }
              try {
                $health = Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 -Uri "http://127.0.0.1:42710/netease"
                if ($health.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {}
            }
            if (-not $ready) {
              throw "R3PLAYX local NetEase server did not become ready"
            }

            $source = Invoke-RestMethod -TimeoutSec 45 -Uri "http://127.0.0.1:42710/netease/song/url/v1?id=418602084&level=exhigh"
            $url = $source.data[0].url
            if (-not $url) {
              throw "Playback route returned no audio URL for smoke-test track"
            }
            Write-Host "R3PLAYX_PLAYBACK_ROUTE_OK level=$($source.data[0].level) source=$($source.data[0].source)"
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Dump packaged Express diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          $asar = Get-ChildItem -Path ./packages/desktop/release -Filter app.asar -Recurse | Select-Object -First 1
          if (-not $asar) { exit 0 }
          New-Item -ItemType Directory -Force -Path ./asar-dump | Out-Null
          pnpm dlx @electron/asar extract $asar.FullName ./asar-dump
          Write-Host "--- root express package ---"
          if (Test-Path ./asar-dump/node_modules/express/package.json) {
            Get-Content ./asar-dump/node_modules/express/package.json
          }
          Write-Host "--- root express utils lines 90-130 ---"
          if (Test-Path ./asar-dump/node_modules/express/lib/utils.js) {
            $lines = Get-Content ./asar-dump/node_modules/express/lib/utils.js
            for ($i = 89; $i -lt [Math]::Min(130, $lines.Count); $i++) {
              Write-Host ("{0}: {1}" -f ($i + 1), $lines[$i])
            }
          }
          Write-Host "--- nearby runtime package versions ---"
          foreach ($pkg in @("depd","array-flatten","content-disposition","@neteasecloudmusicapienhanced/api")) {
            $p = Join-Path ./asar-dump/node_modules $pkg
            $p = Join-Path $p "package.json"
            if (Test-Path $p) {
              $json = Get-Content $p -Raw | ConvertFrom-Json
              Write-Host "$($json.name)@$($json.version)"
            }
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: R3PLAYX-win-runtime-fix
          path: ./packages/desktop/release/*x64-Setup.exe
          if-no-files-found: error
