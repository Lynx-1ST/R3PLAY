name: Publish dev Windows release

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Dev revision: 1 creates dev-2.9.0r1 for package version 2.9.0'
        required: true
        default: '1'
        type: string

permissions:
  contents: write

jobs:
  windows:
    uses: ./.github/workflows/windows-release.yml
    with:
      channel: dev
      revision: ${{ inputs.revision }}
    secrets: inherit
