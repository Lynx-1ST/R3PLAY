name: Tauri Windows Preview

on:
  push:
    branches: [dev]
    paths:
      - 'packages/tauri/**'
      - 'packages/web/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/tauri-preview.yml'
  pull_request:
    paths:
      - 'packages/tauri/**'
      - 'packages/web/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/tauri-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install frontend dependencies without Electron install scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck frontend
        run: pnpm --filter web test:types
      - name: Test API bridge
        run: pnpm --filter web exec vitest run test/utils/tauriApiAdapter.test.ts
      - name: Check Rust formatting
        run: cargo fmt --manifest-path packages/tauri/src-tauri/Cargo.toml -- --check
      - name: Build Windows installer
        run: pnpm tauri:build
      - name: Test Rust request validation
        run: cargo test --locked --manifest-path packages/tauri/src-tauri/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: R3PLAYX-Tauri-Windows-Preview
          path: packages/tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
