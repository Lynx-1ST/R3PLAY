name: Rebuild existing stable Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag, e.g. v2.9.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    uses: ./.github/workflows/windows-release.yml
    with:
      channel: stable
      tag: ${{ inputs.tag }}
      rebuild: true
    secrets: inherit
