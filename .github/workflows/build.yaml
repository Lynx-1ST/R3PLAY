name: Build-Release-Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Resolve and validate release metadata
        id: version
        shell: pwsh
        run: |
          $package = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          $version = $package.version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Expected a stable package version, got '$version'."
          }
          $tag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $tag) {
            throw "Release tag '$env:GITHUB_REF_NAME' does not match package version '$tag'."
          }
          $desktop = Get-Content -LiteralPath packages/desktop/package.json -Raw | ConvertFrom-Json
          if ($desktop.version -ne $version) {
            throw "Desktop version '$($desktop.version)' does not match root version '$version'."
          }
          $notes = "release-notes/$tag.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Missing release notes: $notes"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "notes=$notes" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.6.12

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Copy environment
        shell: pwsh
        run: Copy-Item .env.example .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck web
        run: pnpm --filter web test:types

      - name: Typecheck desktop
        run: pnpm --filter desktop test:types

      - name: Test Discord Rich Presence
        run: pnpm --filter desktop test:discord

      - name: Test audio cache, ranges and media CORS
        run: pnpm --filter desktop test:cache

      - name: Test web
        run: pnpm --filter web exec vitest run

      - name: Test desktop
        run: pnpm --filter desktop exec vitest run

      - name: Build server
        run: pnpm --filter server build

      - name: Build workspaces
        env:
          ELECTRON_WEB_SERVER_PORT: 42710
          ELECTRON_DEV_NETEASE_API_PORT: 30001
          UNBLOCK_SERVER_PORT: 30003
          VITE_APP_NETEASE_API_URL: /netease
          ENABLE_FLAC: 'true'
          ENABLE_LOCAL_VIP: 'svip'
          IS_ELECTRON: 'yes'
        run: pnpm exec turbo run build

      - name: Package Windows app
        env:
          ELECTRON_WEB_SERVER_PORT: 42710
          ELECTRON_DEV_NETEASE_API_PORT: 30001
          UNBLOCK_SERVER_PORT: 30003
          VITE_APP_NETEASE_API_URL: /netease
          ENABLE_FLAC: 'true'
          ENABLE_LOCAL_VIP: 'svip'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter desktop exec electron-builder build -c .electron-builder.config.js --win --x64 --publish never

      - name: Smoke test with packaged Electron
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          $app = Resolve-Path 'packages/desktop/release/win-unpacked/R3PLAYX.exe'
          $resources = Resolve-Path 'packages/desktop/release/win-unpacked/resources'
          $script = (Resolve-Path 'packages/desktop/scripts/testRuntime.cjs').Path
          $probe = Start-Process $app -ArgumentList @('"' + $script + '"', '"' + $resources + '"') -WindowStyle Hidden -Wait -PassThru
          if ($probe.ExitCode -ne 0) { throw 'Packaged Electron runtime test failed.' }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
          node packages/desktop/scripts/testStartup.cjs $app
          if ($LASTEXITCODE -ne 0) { throw 'Packaged application startup failed.' }

      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Get-ChildItem packages/desktop/release/*-Setup.exe -ErrorAction SilentlyContinue | Copy-Item -Destination release-assets
          Get-ChildItem packages/desktop/release/latest.yml -ErrorAction SilentlyContinue | Copy-Item -Destination release-assets

          $installer = Get-ChildItem release-assets/*-Setup.exe -ErrorAction SilentlyContinue
          if (-not $installer) {
            throw "Windows installer was not produced."
          }
          if (-not (Test-Path -LiteralPath release-assets/latest.yml -PathType Leaf)) {
            throw "Windows updater metadata was not produced."
          }

          Write-Host "--- Windows release assets ---"
          Get-ChildItem release-assets

      - name: Upload Windows Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: R3PLAYX-Windows-${{ steps.version.outputs.tag }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish Windows release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          body_path: ${{ steps.version.outputs.notes }}
          fail_on_unmatched_files: true
          files: |
            release-assets/*-Setup.exe
            release-assets/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
