name: Build-Release-Windows

on:
  push:
    branches:
      - release

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: true

jobs:
  windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.6.12

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Remove broken v2.8.1 release and tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"

          gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" --silent 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0

          if ($releaseExists) {
            Write-Host "Deleting broken release and tag $tag"
            gh release delete $tag --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to delete existing release $tag"
            }
          }
          else {
            gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>$null
            $tagExists = $LASTEXITCODE -eq 0
            $global:LASTEXITCODE = 0

            if ($tagExists) {
              Write-Host "Deleting existing tag $tag"
              gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag"
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to delete existing tag $tag"
              }
            }
            else {
              Write-Host "Release/tag $tag does not exist; continuing."
            }
          }

          exit 0

      - name: Copy environment
        shell: pwsh
        run: Copy-Item .env.example .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck web
        run: pnpm --filter web test:types

      - name: Typecheck desktop
        run: pnpm --filter desktop test:types

      - name: Build server
        run: pnpm --filter server build

      - name: Build workspaces
        env:
          ELECTRON_WEB_SERVER_PORT: 42710
          ELECTRON_DEV_NETEASE_API_PORT: 30001
          UNBLOCK_SERVER_PORT: 30003
          VITE_APP_NETEASE_API_URL: /netease
          ENABLE_FLAC: 'true'
          ENABLE_LOCAL_VIP: 'svip'
          IS_ELECTRON: 'yes'
        run: pnpm exec turbo run build

      - name: Package Windows app
        env:
          ELECTRON_WEB_SERVER_PORT: 42710
          ELECTRON_DEV_NETEASE_API_PORT: 30001
          UNBLOCK_SERVER_PORT: 30003
          VITE_APP_NETEASE_API_URL: /netease
          ENABLE_FLAC: 'true'
          ENABLE_LOCAL_VIP: 'svip'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter desktop exec electron-builder build -c .electron-builder.config.js --win --x64 --publish never

      - name: Smoke test packaged runtime dependencies
        shell: pwsh
        run: |
          $modules = Resolve-Path "packages/desktop/release/win-unpacked/resources/app.asar.unpacked/node_modules"
          $entitiesDecode = Join-Path $modules "entities/dist/commonjs/decode.js"

          if (-not (Test-Path $entitiesDecode)) {
            throw "Packaged app is missing entities/decode runtime dependency."
          }

          $neteaseApi = Join-Path $modules "@neteasecloudmusicapienhanced/api"
          $unblockUtils = Join-Path $neteaseApi "node_modules/@neteasecloudmusicapienhanced/unblockmusic-utils"
          $neteaseExpress = Join-Path $neteaseApi "node_modules/express"
          $unblockExpress = Join-Path $unblockUtils "node_modules/express"

          Write-Host "Requiring vendored Express 5 for NetEase API..."
          node -e "require(process.argv[1]); console.log('netease express load ok')" $neteaseExpress
          if ($LASTEXITCODE -ne 0) {
            throw "NetEase API Express dependency failed to load."
          }

          Write-Host "Requiring vendored Express 4 for unblockmusic-utils..."
          node -e "require(process.argv[1]); console.log('unblock express load ok')" $unblockExpress
          if ($LASTEXITCODE -ne 0) {
            throw "Unblockmusic Express dependency failed to load."
          }

          Write-Host "Requiring packaged NetEase API..."
          node -e "require(process.argv[1]); console.log('netease api load ok')" $neteaseApi
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged NetEase API failed to load."
          }

          Write-Host "Requiring NetEase API's packaged unblockmusic-utils..."
          node -e "require(process.argv[1]); console.log('unblock utils load ok')" $unblockUtils
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged unblockmusic-utils failed to load."
          }

          $nestedUnblockApi = Join-Path $unblockUtils "node_modules/@unblockneteasemusic/server"
          Write-Host "Requiring NetEase API's nested UnblockNeteaseMusic server..."
          node -e "require(process.argv[1]); console.log('nested unblock server load ok')" $nestedUnblockApi
          if ($LASTEXITCODE -ne 0) {
            throw "Nested UnblockNeteaseMusic server failed to load."
          }

          $unblockApi = Join-Path $modules "@unblockneteasemusic/server"
          Write-Host "Requiring app's direct UnblockNeteaseMusic server..."
          node -e "require(process.argv[1]); console.log('direct unblock server load ok')" $unblockApi
          if ($LASTEXITCODE -ne 0) {
            throw "Direct UnblockNeteaseMusic server failed to load."
          }

          Write-Host "Packaged runtime dependency smoke test passed."

      - name: Resolve release tag
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Get-ChildItem packages/desktop/release/*-Setup.exe -ErrorAction SilentlyContinue | Copy-Item -Destination release-assets
          Get-ChildItem packages/desktop/release/latest.yml -ErrorAction SilentlyContinue | Copy-Item -Destination release-assets

          $installer = Get-ChildItem release-assets/*-Setup.exe -ErrorAction SilentlyContinue
          if (-not $installer) {
            throw "Windows installer was not produced."
          }

          Write-Host "--- Windows release assets ---"
          Get-ChildItem release-assets

      - name: Publish Windows release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: release
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*-Setup.exe
            release-assets/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: R3PLAYX-Windows-${{ steps.version.outputs.tag }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
