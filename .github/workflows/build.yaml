name: Build-Release

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.6.12

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install global build tools
        run: npm i prisma fastify-cli turbo tsx -g

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy environment
        run: cp .env.example .env

      - name: Resolve release version
        shell: bash
        run: echo "RELEASE_TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Build workspaces
        env:
          ELECTRON_WEB_SERVER_PORT: 42710
          ELECTRON_DEV_NETEASE_API_PORT: 30001
          UNBLOCK_SERVER_PORT: 30003
          VITE_APP_NETEASE_API_URL: /netease
          ENABLE_FLAC: 'true'
          ENABLE_LOCAL_VIP: 'svip'
          IS_ELECTRON: 'yes'
        run: turbo run build

      - name: Package Electron app
        env:
          ELECTRON_WEB_SERVER_PORT: 42710
          ELECTRON_DEV_NETEASE_API_PORT: 30001
          UNBLOCK_SERVER_PORT: 30003
          VITE_APP_NETEASE_API_URL: /netease
          ENABLE_FLAC: 'true'
          ENABLE_LOCAL_VIP: 'svip'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter desktop exec electron-builder build -c .electron-builder.config.js --publish never

      - name: Collect release artifacts
        shell: bash
        run: |
          set -eu
          mkdir -p release-assets
          shopt -s nullglob
          for f in \
            packages/desktop/release/*.dmg \
            packages/desktop/release/*-Setup.exe \
            packages/desktop/release/*.AppImage \
            packages/desktop/release/*.deb \
            packages/desktop/release/latest*.yml ; do
            cp "$f" release-assets/
          done
          echo "--- assets to upload ---"
          ls -lah release-assets/ || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          target_commitish: release
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: R3PLAYX-${{ runner.os }}
          path: release-assets/*
          if-no-files-found: warn
          retention-days: 14
